name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install DejaVu fonts (needed for rendering)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Render every example (DRC must pass)
        run: |
          mkdir -p examples/out
          for f in examples/json/*.json; do
            python -m wirewright.cli render "$f" -o "examples/out/$(basename "${f%.json}").png" --json
          done
          for f in examples/*.py; do python "$f"; done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wirewright .
      - name: Smoke-test image
        run: |
          docker run --rm wirewright components
          mkdir -p examples/out
          docker run --rm -v "$PWD/examples":/work wirewright \
            render /work/json/led_blink.json -o /work/out/led_blink.png --json
